<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลการสำรวจบุคลากร - สำนักงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= VARIABLES & THEME ================= */
        :root {
            --primary: #4F46E5;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --secondary: #0EA5E9;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        /* Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #EEF2FF, #E0F2FE, #F3E8FF, #F8FAFC);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Background floating elements (Decorative) */
        .blob {
            position: absolute;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s ease-in-out infinite;
        }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #C7D2FE; animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 350px; height: 350px; background: #BAE6FD; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* ================= MAIN CONTAINER ================= */
        .main-container {
            width: 100%;
            max-width: 1000px;
            z-index: 1;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.02em;
            line-height: 1.3;
            background: linear-gradient(135deg, #1E293B, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ================= GRID & CARDS (Glassmorphism) ================= */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.1);
            background: rgba(255, 255, 255, 0.9);
        }

        .service-card:hover::before { opacity: 1; }

        /* ================= ICONS & CONTENT ================= */
        .icon-box {
            width: 80px; height: 80px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            transition: transform 0.4s;
        }
        
        .icon-box svg { width: 40px; height: 40px; }
        
        .service-card:hover .icon-box { transform: scale(1.1); }

        .icon-storage { 
            background: #EFF6FF; 
            color: #3B82F6; 
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.2);
        }
        
        .icon-ai { 
            background: #FAF5FF; 
            color: #A855F7; 
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.2);
        }

        .service-card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .btn-action {
            background-color: var(--text-dark);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action svg { width: 16px; height: 16px; transition: transform 0.3s; }

        .service-card:hover .btn-action {
            background-color: var(--primary);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .service-card:hover .btn-action svg {
            transform: translateX(4px);
        }

        /* ================= FULLSCREEN LOADER ================= */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .loader-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #E2E8F0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
            margin-bottom: 20px;
        }

        .loader-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-dark);
            letter-spacing: 0.02em;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">กำลังประมวลผลข้อมูล...</div>
    </div>

    <div class="main-container">
        <div class="header">
            <h1>ข้อมูลการสำรวจบุคลากรสำนักงานสำนัก</h1>
        </div>

        <div class="services-grid">
            
            <a href="survey-storage.html" class="service-card">
                <div>
                    <div class="icon-box icon-storage">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                        </svg>
                    </div>
                    <h2>แบบสำรวจพฤติกรรมการทำงานและพื้นที่จัดเก็บข้อมูลอิเล็กทรอนิกส์</h2>
                </div>
                <div class="btn-action">
                    ดูรายละเอียด
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </div>
            </a>

            <a href="survey-ai.html" class="service-card">
                <div>
                    <div class="icon-box icon-ai">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                        </svg>
                    </div>
                    <h2>แบบสำรวจการประยุกต์ใช้เทคโนโลยี AI เพื่อเพิ่มประสิทธิภาพการปฏิบัติงาน</h2>
                </div>
                <div class="btn-action">
                    ดูรายละเอียด
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </div>
            </a>

        </div>
    </div>

    <script>
        document.querySelectorAll('.service-card').forEach(card => {
            card.addEventListener('click', function(e) {
                // ป้องกันการย้ายหน้าทันที
                e.preventDefault();
                
                // ดึง URL เป้าหมายจาก href
                const targetUrl = this.getAttribute('href');
                const overlay = document.getElementById('loaderOverlay');
                const text = document.getElementById('loaderText');
                
                // แสดงหน้าจอ Loading
                overlay.classList.add('active');
                
                // เปลี่ยนข้อความเพื่อความสมจริง (หลังจาก 1 วินาที)
                setTimeout(() => {
                    text.innerText = "กำลังเข้าสู่หน้า Dashboard...";
                }, 1000);

                // เปลี่ยนหน้าหลังจากโหลดครบ 2.5 วินาที
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 2500);
            });
        });
    </script>

</body>
</html>
