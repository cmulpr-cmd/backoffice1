<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บริการหลักของเรา - สำนักงานบริการข้อมูล</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            background: #fff;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #333;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .service-card h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #444;
        }

        .service-card p {
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-action {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .service-card:hover .btn-action {
            background-color: #0056b3;
        }

        /* ปรับสีไอคอนตามบริการ */
        .icon-purple { color: #6f42c1; }
        .icon-blue { color: #007bff; }
        .icon-pink { color: #e83e8c; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>บริการหลักของเรา</h1>
        </div>

        <div class="services-grid">
            <a href="ค้นคว้าข้อมูล" class="service-card">
                <div>
                    <div class="icon icon-purple">🔍</div>
                    <h2>ค้นคว้าข้อมูลและวิจัย</h2>
                    <p>เข้าถึงฐานข้อมูลวิจัย งานวิจัย และวารสารระดับโลก</p>
                </div>
                <button class="btn-action">ดูรายละเอียด</button>
            </a>

            <a href="ยืม-คืน" class="service-card">
                <div>
                    <div class="icon icon-blue">📖</div>
                    <h2>ยืม-คืนทรัพยากรการเรียนรู้</h2>
                    <p>ระบบยืม-คืนสื่อทุกประเภท พร้อมบริการจองและจัดส่ง</p>
                </div>
                <button class="btn-action">ดูรายละเอียด</button>
            </a>

            <a href="สนับสนุนวิจัย" class="service-card">
                <div>
                    <div class="icon icon-pink">🎓</div>
                    <h2>สนับสนุนงานวิจัยและนวัตกรรม</h2>
                    <p>เครื่องมือวิเคราะห์ข้อมูล ทุนวิจัย และเผยแพร่ผลงาน</p>
                </div>
                <button class="btn-action">ดูรายละเอียด</button>
            </a>
        </div>
    </div>

</body>
</html>
